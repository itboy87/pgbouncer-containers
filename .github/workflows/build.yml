name: Build and publish PgBouncer 1.26.1

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: publish-pgbouncer-1.26.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published release tag
        shell: bash
        run: |
          if docker manifest inspect ghcr.io/${{ github.repository_owner }}/pgbouncer:1.26.1 >/dev/null 2>&1; then
            echo 'Release tag exists. Publish a separately reviewed new release/rebuild tag.' >&2
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build, run upstream regression tests, and publish
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        env:
          environment: production
          registry: ghcr.io/${{ github.repository_owner }}
          revision: ${{ github.sha }}
        with:
          push: true
      - name: Verify both published binaries and non-root identity
        id: verify
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$BUILD_METADATA" > build-metadata.json
          digest=$(jq -r '.default."containerimage.digest"' build-metadata.json)
          test "${digest#sha256:}" != "$digest"
          image="ghcr.io/${{ github.repository_owner }}/pgbouncer@$digest"
          for architecture in amd64 arm64; do
            docker pull --platform "linux/$architecture" "$image"
            docker run --rm --platform "linux/$architecture" "$image" --version | tee "version-$architecture.txt"
            head -1 "version-$architecture.txt" | grep -Fx 'PgBouncer 1.26.1'
            test "$(docker run --rm --platform "linux/$architecture" --entrypoint /usr/bin/id "$image" -u)" = 998
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan published image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.verify.outputs.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable multi-architecture image
        env:
          IMAGE: ${{ steps.verify.outputs.image }}
        run: cosign sign --yes "$IMAGE"
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pgbouncer-1.26.1-build-evidence
          path: |
            build-metadata.json
            version-*.txt
          if-no-files-found: ignore
